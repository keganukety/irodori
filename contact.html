<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | irodori / 白岩あやな</title>
  <meta name="description" content="Webデザイン・コーディングのご依頼・ご相談はこちらから。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #1a1a1a;
      --gray: #666;
      --light-gray: #aaa;
      --border: #eee;
      --pink: #f5c8d8;
      --pink-dark: #e8829c;
      --pink-bg: #fff0f5;
      --purple: #ccc8f0;
      --purple-dark: #8878d4;
      --purple-bg: #f0eeff;
      --green: #b8e8c0;
      --green-dark: #5ab870;
      --green-bg: #f0faef;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #fff;
      color: var(--black);
    }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 60px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { text-decoration: none; }
    .nav-logo-en {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: #333;
      transition: opacity 0.2s;
    }
    .nav-logo-en:hover { opacity: 0.6; }
    .nav-logo-ja { font-size: 9px; letter-spacing: 2px; color: var(--light-gray); margin-top: 2px; }
    .nav-back {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #555;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .nav-back:hover { color: #111; }
    .nav-back-arrow { font-size: 14px; }

    /* HERO */
    .hero {
      padding: 80px 60px 72px;
      background: linear-gradient(135deg, #fef0f5 0%, #f0eeff 50%, #f0faef 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero-bg {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 160px;
      color: rgba(255,255,255,0.6);
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    .hero-label { font-size: 11px; letter-spacing: 3px; color: #b898c8; margin-bottom: 16px; }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      letter-spacing: 4px;
      color: var(--black);
      margin-bottom: 16px;
      line-height: 1;
    }
    .hero-desc { font-size: 13px; color: var(--gray); line-height: 2; }

    /* FORM SECTION */
    .form-section {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }

    .form-card {
      background: #fff;
      border: 1px solid #ede5f8;
      border-radius: 20px;
      padding: 48px 48px;
    }

    .form-group { margin-bottom: 28px; }

    .form-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--black);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .form-required {
      font-size: 10px;
      background: #fde8ef;
      color: #d4607c;
      border: 1px solid var(--pink);
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }
    .form-optional {
      font-size: 10px;
      background: #f5f5f5;
      color: #999;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0d8f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--black);
      background: #fdfcff;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      appearance: none;
    }
    .form-input::placeholder,
    .form-textarea::placeholder { color: #ccc; }
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--purple-dark);
      box-shadow: 0 0 0 3px rgba(136, 120, 212, 0.1);
    }
    .form-textarea { resize: vertical; min-height: 140px; line-height: 1.8; }

    /* SELECT */
    .form-select-wrap { position: relative; }
    .form-select {
      width: 100%;
      padding: 14px 40px 14px 16px;
      border: 1px solid #e0d8f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--black);
      background: #fdfcff;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      appearance: none;
      cursor: pointer;
    }
    .form-select:focus {
      border-color: var(--purple-dark);
      box-shadow: 0 0 0 3px rgba(136, 120, 212, 0.1);
    }
    .form-select-arrow {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-right: 1.5px solid #b898c8;
      border-bottom: 1.5px solid #b898c8;
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    /* DIVIDER */
    .form-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, #f5b8cc, #b8a8e8, #a8d8b0);
      margin: 36px 0;
      opacity: 0.4;
    }

    /* SUBMIT */
    .form-submit {
      width: 100%;
      padding: 18px;
      background: #222;
      color: #fff;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: 3px;
      border: none;
      border-radius: 32px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 8px;
    }
    .form-submit:hover { background: #444; transform: scale(1.02); }
    .form-submit:active { transform: scale(0.99); }

    /* SUCCESS MESSAGE */
    .success-msg {
      display: none;
      text-align: center;
      padding: 48px 0;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--green-bg);
      border: 1px solid var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
    }
    .success-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--black);
      margin-bottom: 12px;
    }
    .success-desc { font-size: 13px; color: var(--gray); line-height: 2; }
    .success-back {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 36px;
      background: #222;
      color: #fff;
      font-size: 12px;
      letter-spacing: 2px;
      border-radius: 28px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .success-back:hover { background: #444; }

    /* NOTE */
    .form-note {
      font-size: 11px;
      color: var(--light-gray);
      line-height: 1.8;
      margin-top: 20px;
      text-align: center;
    }

    /* FOOTER */
    .footer {
      padding: 28px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
    }
    .footer-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: #333;
    }
    .footer-copy { font-size: 10px; color: var(--light-gray); letter-spacing: 1px; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .nav { padding: 18px 24px; }
      .hero { padding: 56px 24px 48px; }
      .hero-title { font-size: 52px; }
      .hero-bg { font-size: 90px; }
      .form-card { padding: 32px 24px; }
      .footer { padding: 20px 24px; flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-en">irodori</div>
      <div class="nav-logo-ja">いろどり</div>
    </a>
    <a href="index.html" class="nav-back">
      <span class="nav-back-arrow">←</span> トップへ戻る
    </a>
  </nav>

  <section class="hero">
    <div class="hero-bg">CONTACT</div>
    <div class="hero-label">GET IN TOUCH</div>
    <div class="hero-title">CONTACT</div>
    <div class="hero-desc">
      お仕事のご依頼・ご相談はこちらから。<br>
      3営業日以内にご返信いたします。
    </div>
  </section>

  <section class="form-section">
    <div class="form-card" id="form-card">

      <!-- フォーム本体 -->
      <!-- ★ action の "mpqneawr" をFormspreeのIDに差し替えてください -->
      <form id="contact-form" action="https://formspree.io/f/mpqneawr" method="POST">

        <div class="form-group">
          <label class="form-label" for="name">
            お名前 <span class="form-required">必須</span>
          </label>
          <input class="form-input" type="text" id="name" name="name" placeholder="例：山田 花子" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            メールアドレス <span class="form-required">必須</span>
          </label>
          <input class="form-input" type="email" id="email" name="email" placeholder="例：hanako@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="subject">
            件名 <span class="form-optional">任意</span>
          </label>
          <input class="form-input" type="text" id="subject" name="subject" placeholder="例：Webサイト制作のご相談">
        </div>

        <div class="form-divider"></div>

        <div class="form-group">
          <label class="form-label" for="service">
            依頼内容 <span class="form-required">必須</span>
          </label>
          <div class="form-select-wrap">
            <select class="form-select" id="service" name="service" required>
              <option value="" disabled selected>選択してください</option>
              <option value="webdesign">Webデザイン</option>
              <option value="coding">コーディング</option>
              <option value="production">サイト制作（デザイン＋コーディング）</option>
              <option value="other">その他・相談したい</option>
            </select>
            <div class="form-select-arrow"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">
            メッセージ <span class="form-required">必須</span>
          </label>
          <textarea class="form-textarea" id="message" name="message" placeholder="ご依頼の詳細、ご予算、納期のご希望などをお気軽にご記入ください。" required></textarea>
        </div>

        <button type="submit" class="form-submit">送信する →</button>

        <p class="form-note">
          送信後、確認メールは届きません。<br>
          3営業日以内に返信いたします。
        </p>

      </form>

      <!-- 送信完了メッセージ -->
      <div class="success-msg" id="success-msg">
        <div class="success-icon">✓</div>
        <div class="success-title">THANK YOU</div>
        <div class="success-desc">
          お問い合わせありがとうございます。<br>
          3営業日以内にご返信いたします。
        </div>
        <a href="index.html" class="success-back">トップへ戻る</a>
      </div>

    </div>
  </section>

  <footer class="footer">
    <div class="footer-logo">irodori</div>
    <div class="footer-copy">© 2026 irodori / 白岩あやな. All rights reserved.</div>
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('.form-submit');
      btn.textContent = '送信中...';
      btn.disabled = true;

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          btn.textContent = '送信に失敗しました。再度お試しください。';
          btn.disabled = false;
        }
      } catch {
        btn.textContent = '送信に失敗しました。再度お試しください。';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
