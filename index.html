<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="description" content="iLy.はただいま公開準備中です。" />
    <meta property="og:title" content="iLy. | Coming soon" />
    <meta property="og:description" content="iLy.はただいま公開準備中です。" />
    <meta property="og:site_name" content="iLy." />
    <meta name="twitter:title" content="iLy. | Coming soon" />
    <meta name="twitter:description" content="iLy.はただいま公開準備中です。" />
    <meta name="theme-color" content="#ffffff" />
    <title>iLy. | Coming soon</title>
    <style>
      :root {
        --ily-bg: #ffffff;
        --ily-bg-soft: #faf7f1;
        --ily-text: #242424;
        --ily-muted: #6c6c6c;
        --ily-border-light: rgba(0, 0, 0, 0.12);
        font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
        color: var(--ily-text);
        background: var(--ily-bg);
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--ily-bg), var(--ily-bg-soft));
      }

      .coming-soon {
        width: min(100%, 640px);
        padding: clamp(48px, 9vw, 88px) clamp(28px, 8vw, 72px);
        text-align: center;
        border: 1px solid var(--ily-border-light);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: none;
      }

      .brand {
        display: block;
        margin-bottom: 28px;
        font-family: "Segoe UI", Inter, sans-serif;
        font-size: clamp(2.2rem, 8vw, 4rem);
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--ily-muted);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 4.5vw, 2rem);
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      p:last-child {
        margin: 20px 0 0;
        color: var(--ily-muted);
        font-size: 0.95rem;
        line-height: 1.9;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="coming-soon" aria-labelledby="coming-soon-title">
        <span class="brand">iLy.</span>
        <p class="eyebrow">Coming soon</p>
        <h1 id="coming-soon-title">ただいま準備中です</h1>
        <p>公開まで、もうしばらくお待ちください。</p>
      </section>
    </main>
  </body>
</html>
